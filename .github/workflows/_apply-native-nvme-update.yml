name: Apply Native NVMe update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'refactor: update native NVMe implementation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Native NVMe implementation
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('tweakbyjie.ps1')
          s = p.read_text(encoding='utf-8-sig')

          helpers = r'''function Test-NvmeBackupSchema {
              param([object]$Backup)
              if ($null -eq $Backup -or $Backup.Version -ne 2) { return $false }
              $safe = @($Backup.SafeBoot)
              if ($safe.Count -ne 2) { return $false }
              if (@($safe.Mode | Sort-Object -Unique).Count -ne 2) { return $false }
              foreach ($r in $safe) {
                  if ($null -eq $r.Present) { return $false }
                  if ([bool]$r.Present -and [string]::IsNullOrWhiteSpace([string]$r.Data)) { return $false }
                  if (-not [bool]$r.Present -and ($null -ne $r.Data)) { return $false }
              }
              $features = @($Backup.Features)
              if ($features.Count -ne 2) { return $false }
              foreach ($f in $features) {
                  if ([string]$f.Id -notin @('60786016','48433719')) { return $false }
                  if ([string]$f.BeforeState -notin @('Enabled','Disabled','Default','Unknown')) { return $false }
              }
              return $true
          }

          function Get-NvmeSafeBootSnapshot {
              param([string]$Guid)
              foreach ($mode in @('Minimal','Network')) {
                  $path = "HKLM:\SYSTEM\CurrentControlSet\Control\SafeBoot\$mode\$Guid"
                  $item = Get-Item $path -ErrorAction SilentlyContinue
                  if ($item -and ($item.GetValueNames() -contains '')) {
                      $kind = $item.GetValueKind('').ToString()
                      $value = $item.GetValue('')
                      [pscustomobject]@{ Mode = $mode; Path = $path; Present = $true; Kind = $kind; Data = [string]$value }
                  } else {
                      [pscustomobject]@{ Mode = $mode; Path = $path; Present = $false; Kind = $null; Data = $null }
                  }
              }
          }

          function Get-ViVeFeatureState {
              param([string]$ViVeTool, [string]$Id)
              try {
                  $out = & $ViVeTool /query /id:$Id 2>&1
                  $text = ($out -join "`n")
                  if ($text -match 'State:\s*Enabled\s*\(2\)') { return 'Enabled' }
                  if ($text -match 'State:\s*Disabled\s*\(1\)') { return 'Disabled' }
                  if ($text -match 'No configuration|ImageDefault') { return 'Default' }
                  return 'Unknown'
              } catch { return 'Unknown' }
          }

          function Find-ViVeTool {
              $local = Join-Path $PSScriptRoot 'ViVeTool.exe'
              if (Test-Path $local) { return $local }
              $cmd = Get-Command 'ViVeTool.exe' -ErrorAction SilentlyContinue
              if ($cmd) { return $cmd.Source }
              $cmd = Get-Command 'vivetool.exe' -ErrorAction SilentlyContinue
              if ($cmd) { return $cmd.Source }
              return $null
          }

          function Ensure-NvmeBackup {
              param([string]$Guid, [string]$ViVeTool)
              try {
                  if (Test-Path $script:nvmeBackupFile) {
                      $backup = Get-Content $script:nvmeBackupFile -Raw -ErrorAction Stop | ConvertFrom-Json -ErrorAction Stop
                      if (-not (Test-NvmeBackupSchema $backup)) { throw 'nvme-backup.json 结构不正确或版本过旧' }
                      return $true
                  }
                  $features = @('60786016','48433719') | ForEach-Object {
                      [pscustomobject]@{ Id = $_; BeforeState = (Get-ViVeFeatureState $ViVeTool $_) }
                  }
                  $backup = [pscustomobject]@{
                      Version = 2
                      CreatedAt = (Get-Date).ToString('o')
                      Features = @($features)
                      SafeBoot = @(Get-NvmeSafeBootSnapshot $Guid)
                  }
                  if (-not (Test-NvmeBackupSchema $backup)) { throw '生成的 NVMe 备份未通过结构校验' }
                  ConvertTo-Json -InputObject $backup -Depth 6 | Set-Content -Path $script:nvmeBackupFile -Encoding UTF8 -ErrorAction Stop
                  Write-Host "[OK] Native NVMe 原始状态已备份：$script:nvmeBackupFile" -ForegroundColor Green
                  return $true
              } catch {
                  Write-Host "[FAIL] Native NVMe 原始状态备份失败：$($_.Exception.Message)；已阻止修改" -ForegroundColor Red
                  $script:fail++
                  return $false
              }
          }

          function Restore-NvmeSafeBootBackup {
              param([string]$Guid, [string]$ViVeTool)
              if (-not (Test-Path $script:nvmeBackupFile)) { Write-Host '[FAIL] 未找到 nvme-backup.json，无法精确恢复 Native NVMe' -ForegroundColor Red; $script:fail++; return $false }
              try {
                  $backup = Get-Content $script:nvmeBackupFile -Raw -ErrorAction Stop | ConvertFrom-Json -ErrorAction Stop
                  if (-not (Test-NvmeBackupSchema $backup)) { throw 'nvme-backup.json 结构不正确' }
                  $allOk = $true
                  foreach ($f in @($backup.Features)) {
                      switch ([string]$f.BeforeState) {
                          'Enabled'  { $out = & $ViVeTool /enable /id:$($f.Id) 2>&1; if ($LASTEXITCODE -ne 0) { $allOk=$false; $script:fail++ } }
                          'Disabled' { $out = & $ViVeTool /disable /id:$($f.Id) 2>&1; if ($LASTEXITCODE -ne 0) { $allOk=$false; $script:fail++ } }
                          'Default'  { $out = & $ViVeTool /reset /id:$($f.Id) 2>&1; if ($LASTEXITCODE -ne 0) { $allOk=$false; $script:fail++ } }
                          default    { Write-Host "[WARN] Feature $($f.Id) 原始状态未知，跳过精确恢复" -ForegroundColor Yellow }
                      }
                  }
                  foreach ($r in @($backup.SafeBoot)) {
                      $regPath = Convert-RegExePath $r.Path
                      if ([bool]$r.Present) {
                          & reg.exe ADD $regPath /ve /t REG_SZ /d ([string]$r.Data) /f *> $null
                          if ($LASTEXITCODE -ne 0) { $allOk=$false; $script:fail++ } else { $script:ok++; $script:rebootRequired=$true }
                      } else {
                          & reg.exe DELETE $regPath /ve /f *> $null
                          if ($LASTEXITCODE -eq 0) { $script:ok++; $script:rebootRequired=$true } else { $script:skip++ }
                      }
                  }
                  if ($allOk) { Write-Host '[OK] Native NVMe 已按修改前快照恢复。' -ForegroundColor Green }
                  return $allOk
              } catch { Write-Host "[FAIL] Native NVMe 恢复失败：$($_.Exception.Message)" -ForegroundColor Red; $script:fail++; return $false }
          }

          function Test-NativeNvmeEffective {
              $file = Join-Path $env:SystemRoot 'System32\drivers\nvmedisk.sys'
              $exists = Test-Path $file
              $drv = Get-CimInstance Win32_SystemDriver -Filter "Name='nvmedisk'" -ErrorAction SilentlyContinue
              $state = if ($drv) { [string]$drv.State } else { 'NotLoaded' }
              [pscustomobject]@{ FileExists=$exists; State=$state }
          }

          function Test-NativeNvmeConfigured {
              param([string]$ViVeTool)
              $a = Get-ViVeFeatureState $ViVeTool '60786016'
              $b = Get-ViVeFeatureState $ViVeTool '48433719'
              return [pscustomobject]@{ Feature60786016=$a; Feature48433719=$b; BothEnabled=($a -eq 'Enabled' -and $b -eq 'Enabled') }
          }

          function Request-Restart {
              if (-not $script:rebootRequired) { return }
              Write-Host '[待重启] 当前模块产生了需要重启后生效的修改；本模块不会单独触发重启。' -ForegroundColor Yellow
              Write-Host '         可继续执行其他模块，退出主菜单时统一决定是否重启。' -ForegroundColor Yellow
          }

          function Invoke-FinalRestartPrompt {
              if (-not $script:rebootRequired) { Write-Host '[完成] 当前会话没有待重启修改。' -ForegroundColor Green; return }
              Write-Host ''; Write-Host '============================================================' -ForegroundColor Cyan
              Write-Host ' 本次会话存在待重启修改 / Restart Pending' -ForegroundColor Yellow
              if ($script:fail -gt 0) { Write-Host " [警告] 本次会话存在 $($script:fail) 个失败或验证失败项；重启不会自动解决失败项。" -ForegroundColor Red }
              $r = Read-Host '退出前现在重启吗？输入 Y 立即重启；输入 N 返回系统（默认 N）'
              if ($r -match '^[Yy]$') {
                  if ($script:fail -gt 0) { $confirm = Read-Host '检测到失败/验证失败，仍要重启吗？输入 Y 确认；其他键取消'; if ($confirm -notmatch '^[Yy]$') { Write-Host '[取消] 已取消重启。' -ForegroundColor Yellow; return } }
                  Write-Host '[重启] 立即重启 / Restarting now...' -ForegroundColor Red
                  Restart-Computer -Force
              } else { Write-Host '[结束] 本次不重启；待重启设置仍会保留。' -ForegroundColor Green }
          }
          '''

          pattern_helpers = r'function Test-NvmeBackupSchema \{.*?function Test-BcdBackupSchema \{'
          ns, n = re.subn(pattern_helpers, helpers + '\n\nfunction Test-BcdBackupSchema {', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('NVMe helper section marker not found')
          s = ns

          part8 = r'''} elseif ($choice -eq "8") {

              $script:moduleFailBaseline = $fail
              # ======================= Part 8: Native NVMe Driver =======================
              # Preferred path on affected Windows 11 25H2 builds: ViVeTool feature IDs
              # 60786016 + 48433719. The legacy registry override is intentionally not
              # treated as proof of success because recent builds may ignore it.
              Write-Host ""
              Write-Host "============ [Part 8] 原生 NVMe 驱动 / Native NVMe Driver ============" -ForegroundColor Cyan
              Write-Host ""
              $cvKey = Get-Item 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
              $buildNum = [int]($cvKey.GetValue('CurrentBuildNumber'))
              $dispVer = [string]($cvKey.GetValue('DisplayVersion'))
              $nvmeDisks = @(Get-Disk | Where-Object { $_.BusType -eq 'NVMe' })
              Write-Host ("系统版本 : $dispVer (build $buildNum)")
              Write-Host ("NVMe 磁盘 : " + $(if ($nvmeDisks.Count -gt 0) { "检测到 $($nvmeDisks.Count) 块" } else { "未检测到" }))

              if ($nvmeDisks.Count -eq 0) {
                  Write-Host "[SKIP] 未检测到 NVMe 磁盘，本项无作用，已跳过（不重启）" -ForegroundColor Yellow
              } else {
                  $sbGuid = '{75416E63-5912-4DFA-AE8F-3EFACCAFFB14}'
                  $fmPath = 'HKLM:\SYSTEM\CurrentControlSet\Policies\Microsoft\FeatureManagement\Overrides'
                  $legacyIds = @('735209102','1853569164','156965516')
                  $viVe = Find-ViVeTool
                  Write-Host "  0. 查看当前状态（Feature / SafeBoot / nvmedisk 实际状态）" -ForegroundColor White
                  Write-Host "  1. 启用 Native NVMe（ViVeTool 60786016 + 48433719）" -ForegroundColor White
                  Write-Host "  2. 还原到启用前快照" -ForegroundColor White
                  $nChoice = Read-Host "请输入 0、1 或 2 并回车"

                  if ($nChoice -eq '0') {
                      if ($viVe) {
                          $cfg = Test-NativeNvmeConfigured $viVe
                          Write-Host "ViVeTool 60786016 : $($cfg.Feature60786016)"
                          Write-Host "ViVeTool 48433719 : $($cfg.Feature48433719)"
                      } else { Write-Host "ViVeTool : 未找到（请将 ViVeTool.exe 放在脚本目录或 PATH）" -ForegroundColor Yellow }
                      $legacy = @(); $fmItem = Get-Item $fmPath -ErrorAction SilentlyContinue
                      foreach ($id in $legacyIds) { if ($fmItem -and ($fmItem.GetValueNames() -contains $id)) { $legacy += "$id=$($fmItem.GetValue($id))" } else { $legacy += "$id=未写入" } }
                      Write-Host ("Legacy Velocity Override : " + ($legacy -join '  '))
                      foreach ($mode in @('Minimal','Network')) { $p0="HKLM:\SYSTEM\CurrentControlSet\Control\SafeBoot\$mode\$sbGuid"; Write-Host ("SafeBoot {0} : {1}" -f $mode, $(if(Test-Path $p0){'已有'}else{'缺失'})) }
                      $effective = Test-NativeNvmeEffective
                      $file = Join-Path $env:SystemRoot 'System32\drivers\nvmedisk.sys'
                      Write-Host ("nvmedisk.sys 文件 : " + $(if($effective.FileExists){'存在'}else{'不存在'}))
                      Write-Host ("nvmedisk 驱动状态 : $($effective.State)")
                      if ($effective.State -eq 'Running') { Write-Host '[EFFECTIVE] 原生 NVMe 驱动正在运行。' -ForegroundColor Green }
                      elseif ($viVe -and (Test-NativeNvmeConfigured $viVe).BothEnabled) { Write-Host '[CONFIGURED] 两个 Feature 已启用；必须重启后再判断实际驱动。' -ForegroundColor Yellow }
                      else { Write-Host '[NOT ENABLED] Native NVMe 当前未确认生效。' -ForegroundColor Yellow }

                  } elseif ($nChoice -eq '1') {
                      if ($buildNum -lt 26200) { Write-Host "[ABORTED] build $buildNum 低于 26200；此模块仅针对 Windows 11 25H2+。" -ForegroundColor Red }
                      elseif (-not $viVe) { Write-Host '[ABORTED] 未找到 ViVeTool.exe。请将官方 ViVeTool 放到脚本目录或加入 PATH。' -ForegroundColor Red }
                      else {
                          $bitLockerWarning = $false
                          try {
                              $bl = Get-BitLockerVolume -MountPoint $env:SystemDrive -ErrorAction Stop
                              if ($bl.ProtectionStatus -eq 'On') { $bitLockerWarning = $true }
                          } catch { }
                          if ($bitLockerWarning) { Write-Host '[WARNING] 系统盘 BitLocker 当前处于保护状态。Native NVMe 切换可能触发恢复密钥检查。请确认已有恢复密钥并继续。' -ForegroundColor Yellow; $bc=Read-Host '输入 Y 继续；其他键取消'; if($bc -notmatch '^[Yy]$'){ Write-Host '[SKIP] 已取消。' -ForegroundColor Yellow; $nChoice='cancel' } }
                          if ($nChoice -eq '1') {
                              if (Ensure-NvmeBackup $sbGuid $viVe) {
                                  $beforeFail=$fail
                                  foreach ($id in @('60786016','48433719')) {
                                      & $viVe /enable /id:$id 2>&1 | ForEach-Object { if($_){ Write-Host $_ } }
                                      if ($LASTEXITCODE -ne 0) { Write-Host "[FAIL] ViVeTool enable $id : exit code $LASTEXITCODE" -ForegroundColor Red; $fail++ }
                                      else { Write-Host "[OK] ViVeTool enabled $id" -ForegroundColor Green; $ok++ }
                                  }
                                  if ($fail -eq $beforeFail) {
                                      foreach ($mode in @('Minimal','Network')) {
                                          $sbReg=Convert-RegExePath "HKLM:\SYSTEM\CurrentControlSet\Control\SafeBoot\$mode\$sbGuid"
                                          & reg.exe ADD $sbReg /ve /t REG_SZ /d 'Storage Disks' /f *> $null
                                          if($LASTEXITCODE -eq 0){Write-Host "[OK] SafeBoot $mode = Storage Disks"; $ok++}else{Write-Host "[FAIL] SafeBoot $mode : exit code $LASTEXITCODE" -ForegroundColor Red;$fail++}
                                      }
                                  }
                                  if ($fail -gt $beforeFail) {
                                      Write-Host '[FAIL] Native NVMe 配置未完整完成；按本次备份回滚。' -ForegroundColor Red
                                      Restore-NvmeSafeBootBackup $sbGuid $viVe | Out-Null
                                  } else {
                                      $script:rebootRequired=$true
                                      Write-Host '[CONFIGURED] Native NVMe 已配置；必须重启后再判断实际驱动。' -ForegroundColor Green
                                      Write-Host '            成功标准：nvmedisk.sys 实际运行，而不是仅仅 Feature 显示 Enabled。' -ForegroundColor Yellow
                                  }
                              }
                          }
                      }

                  } elseif ($nChoice -eq '2') {
                      if (-not $viVe) { Write-Host '[ABORTED] 未找到 ViVeTool.exe，无法精确恢复 Feature 状态。' -ForegroundColor Red }
                      else { Restore-NvmeSafeBootBackup $sbGuid $viVe | Out-Null }
                  } else { Write-Host "[ERROR] 无效输入：$nChoice。" -ForegroundColor Red }
              }

} elseif ($choice -eq "9") {'''

          pattern_part8 = r'} elseif \(\$choice -eq "8"\) \{.*?\} elseif \(\$choice -eq "9"\) \{'
          ns, n = re.subn(pattern_part8, part8, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Part 8 marker not found')
          s = ns

          p.write_text(s, encoding='utf-8-sig', newline='')

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-native-nvme-update.yml
          git add tweakbyjie.ps1
          git commit -m "refactor: update native NVMe implementation"
          git push origin HEAD:main
