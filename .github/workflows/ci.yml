name: ci

on:
  # push 不过滤 refs：branches 与 tags 同用为 AND 语义，会导致 tag 推送不触发；
  # 分支与 tag 的取舍由各任务的 if 守卫完成
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          . ./tools/Install-HashLockedModule.ps1 -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -ExpectedSha256 '14e634c828eb98efb9f40b2918ba90f139ed5eccdf663a2a747736d996995d60'
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Error,Warning
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors) { throw "PSScriptAnalyzer found $($errors.Count) error(s)." }
            Write-Host "PSScriptAnalyzer passed with $($results.Count) warning(s) (non-blocking)."
          } else {
            Write-Host "PSScriptAnalyzer: no findings."
          }

  test:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run Pester tests
        shell: pwsh
        run: |
          . ./tools/Install-HashLockedModule.ps1 -Name Pester -RequiredVersion 6.1.0 -ExpectedSha256 '0207a75ea09f81b27c1ded44898b2bb3c845bafa02045bd64a39e26a53ca41b4'
          $config = New-PesterConfiguration
          $config.Run.Path = "./tests"
          $config.Output.Verbosity = "Detailed"
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = @('./tweakbyjie.ps1', './Modules/*.ps1')
          $config.CodeCoverage.CoveragePercentTarget = 15
          Invoke-Pester -Configuration $config
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pester-coverage-${{ github.run_number }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  smoke-windows-powershell:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Loader smoke under Windows PowerShell 5.1
        shell: powershell
        env:
          TWEAK_SKIP_ADMIN_CHECK: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          . .\tweakbyjie.ps1
          $required = @('Show-TweakMenu','Invoke-RegistryModule','Invoke-NvmeModule','Invoke-DeviceGuardModule','Invoke-VbsModule','Invoke-DefenderModule','Ensure-DefenderPolicyBackup','Restore-DefenderPolicyBackup','Test-DefenderBackupSchema','Set-RegDword','Verify-RegDword')
          $missing = @($required | Where-Object { -not (Get-Command $_ -ErrorAction SilentlyContinue) })
          if ($missing.Count -gt 0) { throw ("missing functions: " + ($missing -join ',')) }
          if (@($script:defenderPolicyValues).Count -ne 95) { throw 'defender policy value count mismatch' }
          if (Test-DefenderBackupSchema $null) { throw 'schema accepted null' }
          Write-Host 'Windows PowerShell 5.1 smoke OK'

  coverage-audit:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # 知识库版本由 tools/knowledge.lock.json 锁定,同一 commit 审计结果可复现;
      # 先确认锁定 commit 仍是 youshouldknow/main 当前最新提交,避免知识库更新后静默使用旧快照。
      - name: Verify knowledge lock is current
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lockPath = './tools/knowledge.lock.json'
          if (-not (Test-Path -LiteralPath $lockPath -PathType Leaf)) {
            throw 'knowledge.lock.json 不存在，无法验证知识库版本锁定。'
          }
          $lock = Get-Content -LiteralPath $lockPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $repo = [string]$lock.repository
          $locked = [string]$lock.ref
          if ($repo -ne '3304711297/youshouldknow') {
            throw "knowledge.lock.json repository 错误：$repo"
          }
          if ($locked -notmatch '^[0-9a-fA-F]{40}$') {
            throw "knowledge.lock.json ref 必须是完整 commit SHA：$locked"
          }
          $headers = @{
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'tweakbyjie-coverage-audit'
          }
          $latest = (Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/commits?sha=main&per_page=1" -Headers $headers -TimeoutSec 30)[0].sha
          if ([string]::IsNullOrWhiteSpace([string]$latest)) {
            throw '无法解析 youshouldknow/main 当前最新 commit SHA。'
          }
          if ($latest -ne $locked) {
            throw "知识库锁定已过期：locked=$locked latest=$latest。请先将 tools/knowledge.lock.json 更新到最新 commit，并重新执行 Coverage 审计。"
          }
          Write-Host "[PASS] youshouldknow/main 已锁定到最新 commit $locked" -ForegroundColor Green
      - name: Run cross-repository coverage audit
        shell: pwsh
        run: |
          ./tools/Test-CrossRepoCoverage.ps1

  release:
    # 发布策略（2026-08-26 起）：仅推送 v* tag 时发布。
    # main 推送不再自动发版，根治"源码版本常量天然落后 tag 一位"的问题：
    # 常量在源码中与最近已发布 tag 对齐（tests/VersionConsistency.Tests.ps1 校验），
    # 发版时由打包步骤把该 tag 版本注入 ZIP 内副本。
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, smoke-windows-powershell, coverage-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # 发布串行化：连续 main push 时旧 Release 运行不得与新运行并发竞争版本号与 tag
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Resolve released version
        id: ver
        run: |
          # 本任务仅在推送 v* tag 时运行；版本号即 tag 本身
          VERSION="$GITHUB_REF_NAME"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version: ${VERSION}"
      - name: Stamp version into packaged script
        run: |
          V="${{ steps.ver.outputs.version }}"
          sed -i "s/\$script:TweakVersion = '[^']*'/\$script:TweakVersion = '${V#v}'/" tweakbyjie.ps1
          grep -n "TweakVersion =" tweakbyjie.ps1
      - name: Package runtime ZIP with checksum
        run: |
          V="${{ steps.ver.outputs.version }}"
          zip -r "tweakbyjie-${V}.zip" \
            tweakbyjie.ps1 \
            tweakbyjie.cmd \
            defender-removal.ps1 \
            ultimate-performance.pow \
            README.md \
            LICENSE \
            Modules
          sha256sum "tweakbyjie-${V}.zip" > SHA256SUMS.txt
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          gh release create "$V" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "tweakbyjie $V" \
            "tweakbyjie-${V}.zip" "SHA256SUMS.txt"
