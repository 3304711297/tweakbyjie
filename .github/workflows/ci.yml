name: ci

on:
  # push 不过滤 refs：branches 与 tags 同用为 AND 语义，会导致 tag 推送不触发；
  # 分支与 tag 的取舍由各任务的 if 守卫完成
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -RequiredVersion 1.25.0
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Error,Warning
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors) { throw "PSScriptAnalyzer found $($errors.Count) error(s)." }
            Write-Host "PSScriptAnalyzer passed with $($results.Count) warning(s) (non-blocking)."
          } else {
            Write-Host "PSScriptAnalyzer: no findings."
          }

  test:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -RequiredVersion 6.1.0
          $config = New-PesterConfiguration
          $config.Run.Path = "./tests"
          $config.Output.Verbosity = "Detailed"
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = @('./tweakbyjie.ps1', './Modules/*.ps1')
          $config.CodeCoverage.CoveragePercentTarget = 0
          Invoke-Pester -Configuration $config

  smoke-windows-powershell:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Loader smoke under Windows PowerShell 5.1
        shell: powershell
        env:
          TWEAK_SKIP_ADMIN_CHECK: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          . .\tweakbyjie.ps1
          $required = @('Show-TweakMenu','Invoke-RegistryModule','Invoke-NvmeModule','Invoke-DeviceGuardModule','Invoke-VbsModule','Invoke-DefenderModule','Ensure-DefenderPolicyBackup','Restore-DefenderPolicyBackup','Test-DefenderBackupSchema','Set-RegDword','Verify-RegDword')
          $missing = @($required | Where-Object { -not (Get-Command $_ -ErrorAction SilentlyContinue) })
          if ($missing.Count -gt 0) { throw ("missing functions: " + ($missing -join ',')) }
          if (@($script:defenderPolicyValues).Count -ne 95) { throw 'defender policy value count mismatch' }
          if (Test-DefenderBackupSchema $null) { throw 'schema accepted null' }
          Write-Host 'Windows PowerShell 5.1 smoke OK'

  coverage-audit:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # 知识库版本由 tools/knowledge.lock.json 锁定,同一 commit 审计结果可复现;
      # youshouldknow 内容更新后按 tools/Coverage-Audit-README.md 流程提升锁定
      - name: Run cross-repository coverage audit
        shell: pwsh
        run: |
          ./tools/Test-CrossRepoCoverage.ps1

  release:
    # main 推送四项全绿 → 自动补丁版本；推送 v* tag → 按该 tag 发布里程碑版本
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [lint, test, smoke-windows-powershell, coverage-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compute next version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
            PREV=$(git tag -l 'v*' | sort -V | grep -vxF "$VERSION" | tail -1)
            [[ -n "$PREV" ]] || PREV='v0.1.0'
          else
            # 必须取版本序最高的 tag；git describe 取的是"距 HEAD 最近"的 tag，
            # 曾因此把 v0.2.0 之后的自动版本回退成 v0.1.x
            PREV=$(git tag -l 'v*' | sort -V | tail -1)
            [[ -n "$PREV" ]] || PREV='v0.1.0'
            BASE=${PREV%.*}
            PATCH=${PREV##*.}
            VERSION="${BASE}.$((PATCH + 1))"
          fi
          {
            echo "version=${VERSION}"
            echo "last=${PREV}"
          } >> "$GITHUB_OUTPUT"
          echo "version: ${VERSION} (previous tag: ${PREV})"
      - name: Stamp version into packaged script
        run: |
          V="${{ steps.ver.outputs.version }}"
          sed -i "s/\$script:TweakVersion = '[^']*'/\$script:TweakVersion = '${V#v}'/" tweakbyjie.ps1
          grep -n "TweakVersion =" tweakbyjie.ps1
      - name: Package ZIP with checksum
        run: |
          V="${{ steps.ver.outputs.version }}"
          zip -r "tweakbyjie-${V}.zip" . -x '.git/*' '.github/*'
          sha256sum "tweakbyjie-${V}.zip" > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          LAST="${{ steps.ver.outputs.last }}"
          REPO="https://github.com/${{ github.repository }}"
          NOTES=$(printf '变更内容：[%s → %s](%s/compare/%s...%s) · [CHANGELOG](%s/blob/main/CHANGELOG.md)\n\n包内脚本版本已同步为 %s，完整性校验见附件 SHA256SUMS.txt。' "$LAST" "$V" "$REPO" "$LAST" "$V" "$REPO" "$V")
          gh release create "$V" \
            --title "tweakbyjie $V" \
            --notes "$NOTES" \
            "tweakbyjie-${V}.zip" "SHA256SUMS.txt"
