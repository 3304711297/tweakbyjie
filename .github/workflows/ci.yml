name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -RequiredVersion 1.25.0
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Error,Warning
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors) { throw "PSScriptAnalyzer found $($errors.Count) error(s)." }
            Write-Host "PSScriptAnalyzer passed with $($results.Count) warning(s) (non-blocking)."
          } else {
            Write-Host "PSScriptAnalyzer: no findings."
          }

  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -RequiredVersion 6.1.0
          $config = New-PesterConfiguration
          $config.Run.Path = "./tests"
          $config.Output.Verbosity = "Detailed"
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = @('./tweakbyjie.ps1', './Modules/*.ps1')
          $config.CodeCoverage.CoveragePercentTarget = 0
          Invoke-Pester -Configuration $config

  smoke-windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Loader smoke under Windows PowerShell 5.1
        shell: powershell
        env:
          TWEAK_SKIP_ADMIN_CHECK: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          . .\tweakbyjie.ps1
          $required = @('Show-TweakMenu','Invoke-RegistryModule','Invoke-NvmeModule','Invoke-DeviceGuardModule','Invoke-VbsModule','Invoke-DefenderModule','Ensure-DefenderPolicyBackup','Restore-DefenderPolicyBackup','Test-DefenderBackupSchema','Set-RegDword','Verify-RegDword')
          $missing = @($required | Where-Object { -not (Get-Command $_ -ErrorAction SilentlyContinue) })
          if ($missing.Count -gt 0) { throw ("missing functions: " + ($missing -join ',')) }
          if (@($script:defenderPolicyValues).Count -ne 95) { throw 'defender policy value count mismatch' }
          if (Test-DefenderBackupSchema $null) { throw 'schema accepted null' }
          Write-Host 'Windows PowerShell 5.1 smoke OK'

  coverage-audit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run cross-repository coverage audit
        shell: pwsh
        env:
          KNOWLEDGE_REF: main
        run: |
          ./tools/Test-CrossRepoCoverage.ps1 -KnowledgeRef $env:KNOWLEDGE_REF

  release:
    # 四项检查全绿且为 main 分支推送时自动发布；版本号取最新 tag 补丁位 +1
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, smoke-windows-powershell, coverage-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compute next version
        id: ver
        run: |
          LAST=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo 'v0.1.0')
          BASE=${LAST%.*}
          PATCH=${LAST##*.}
          echo "version=${BASE}.$((PATCH + 1))" >> "$GITHUB_OUTPUT"
          echo "next version: ${BASE}.$((PATCH + 1)) (last tag: ${LAST})"
      - name: Stamp version into packaged script
        run: |
          sed -i "s/\$script:TweakVersion = '[^']*'/\$script:TweakVersion = '${{ steps.ver.outputs.version }}'/" tweakbyjie.ps1
          grep -n "TweakVersion =" tweakbyjie.ps1
      - name: Package ZIP with checksum
        run: |
          V="${{ steps.ver.outputs.version }}"
          zip -r "tweakbyjie-${V}.zip" . -x '.git/*' '.github/*'
          sha256sum "tweakbyjie-${V}.zip" > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          gh release create "$V" \
            --title "tweakbyjie $V" \
            --notes "CI 全绿后自动构建。包内脚本版本已同步为 ${V}；变更内容见提交历史与 CHANGELOG（里程碑变更以手动维护的条目为准）。" \
            "tweakbyjie-${V}.zip" "SHA256SUMS.txt"
