name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  psscriptanalyzer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Error,Warning
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors) { throw "PSScriptAnalyzer found $($errors.Count) error(s)." }
            Write-Host "PSScriptAnalyzer passed with $($results.Count) warning(s) (non-blocking)."
          } else {
            Write-Host "PSScriptAnalyzer: no findings."
          }

  coverage-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs coverage tables reference existing files
        run: |
          echo "Checking that youshouldknow links in docs/coverage are not obviously broken (basic check)..."
          if grep -r "youshouldknow" docs/coverage --include="*.md" | grep -q "http"; then
            echo "Found external youshouldknow links, consider lychee link check in youshouldknow repo."
          fi
          echo "Coverage marker check done."
